<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#13342a"><title>ורטיגו</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&family=Chakra+Petch:wght@500;700&family=Secular+One&display=swap">
<style>
/* Layout: a card table. Opponents' boards on top, deck and discard in the middle, your board, then your hand. */
:root{
  --felt:#13342a; --felt-2:#1a4335; --wood:#2a1d14; --panel:#0f2a21; --rim:#2f5a48;
  --ink:#f3efe4; --dim:#a8bfb3; --glow:#ffcf6b; --hazard:#e5484d; --fix:#2fb36b;
  --display:"Secular One","Assistant",system-ui,sans-serif; --body:"Assistant",system-ui,sans-serif; --digits:"Chakra Petch","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 30%,var(--felt-2),var(--felt) 60%,#0b2219);color:var(--ink);font-family:var(--body);font-size:16px}
.wrap{max-width:900px;margin:0 auto;padding-block:14px 24px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0}
button{font:inherit;cursor:pointer;border-radius:10px;padding:9px 14px;background:#1d4436;color:var(--ink);border:1px solid var(--rim)}
button:hover:not(:disabled){border-color:var(--glow)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
button:disabled{opacity:.4}
button.go{background:var(--glow);color:#2a1d00;border-color:var(--glow);font-weight:800}
input,select{font:inherit;background:#0c241b;color:var(--ink);border:1px solid var(--rim);border-radius:10px;padding:9px 12px;min-width:0}
.muted{color:var(--dim)}.note{font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.box{background:rgba(8,26,20,.7);border:1px solid var(--rim);border-radius:14px;padding:14px}
.tag{font-family:var(--digits);color:var(--glow);letter-spacing:.14em;font-size:12px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-block:10px}
.hero h1{font-size:clamp(56px,14vw,100px);line-height:.95;color:var(--glow)}
.hero p{margin:0;color:var(--dim)}
.fan{display:flex;justify-content:center;height:150px;margin-top:6px}
.fan .card{width:84px;margin-inline:-14px;transform-origin:50% 120%;animation:fanin .7s ease backwards;pointer-events:none}
@keyframes fanin{from{transform:translateY(40px) scale(.7);opacity:0}}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.home-grid .box{display:flex;flex-direction:column;gap:10px}
.code{font-family:var(--digits);font-size:40px;letter-spacing:.25em;color:var(--glow)}
.chip{font-size:13px;padding:3px 10px;border-radius:20px;border:1px solid var(--rim)}
.top{display:flex;justify-content:space-between;align-items:center}
.icon-btn{padding:6px 10px;font-size:14px}
/* cards */
.card{width:96px;aspect-ratio:5.65/8.65;border-radius:10px;position:relative;overflow:hidden;cursor:pointer;flex:none;padding:0;color:var(--ink);
  background:#0d1626;border:3px solid #f3efe4;box-shadow:0 6px 14px rgba(0,0,0,.45);transition:transform .15s}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card:hover{transform:translateY(-5px)}
.card.sel{transform:translateY(-12px);box-shadow:0 0 0 3px var(--glow),0 12px 22px rgba(0,0,0,.5)}
.card .kind{position:absolute;top:5px;inset-inline-start:5px;font-size:10px;padding:1px 6px;border-radius:8px;background:var(--c);color:#fff;font-weight:800}
.card .val{position:absolute;bottom:24px;left:0;right:0;text-align:center;font:700 30px var(--digits);color:#fff;text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.7)}
.card .lbl{position:absolute;inset:auto 0 0 0;padding:14px 4px 5px;background:linear-gradient(transparent,rgba(0,0,0,.85) 45%);text-align:center}
.card .lbl b{font-family:var(--display);font-weight:400;font-size:14px}
.card.pile{width:62px;cursor:default;border-width:2px}.card.pile .val{font-size:18px;bottom:16px}.card.pile .lbl b{font-size:10px}.card.pile .kind{display:none}
.card.pile:hover{transform:none}
/* table */
.table{display:flex;flex-direction:column;gap:10px}
.board{background:rgba(6,20,15,.55);border:1px solid var(--rim);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .3s}
.board.turn{border-color:var(--glow);box-shadow:0 0 0 1px var(--glow) inset}
.board.mine{background:rgba(6,20,15,.75)}
.board.out{opacity:.45}
.board.pulse{animation:pulse .9s}
@keyframes pulse{30%{box-shadow:0 0 0 3px var(--glow),0 0 30px rgba(255,207,107,.5)}}
.bh{display:flex;justify-content:space-between;gap:8px;font-size:14px}.bh b{font-size:16px}
.brow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.slot{display:flex;gap:4px;align-items:center}
.mini-card{width:44px;aspect-ratio:5.65/8.65;border-radius:6px;overflow:hidden;position:relative;border:2px solid #f3efe4;flex:none}
.mini-card img{width:100%;height:100%;object-fit:cover}
.mini-card span{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.75);font-size:9px;text-align:center;line-height:1.3}
.mini-card.hz{border-color:var(--hazard);transform:rotate(-6deg);box-shadow:0 0 10px rgba(229,72,77,.6)}
.mini-empty{width:44px;aspect-ratio:5.65/8.65;border-radius:6px;border:1.5px dashed var(--rim);display:grid;place-items:center;font-size:10px;color:var(--dim)}
.mini-empty.wide{width:60px}
.slot.feet{flex:1;min-width:0;gap:8px}
.fstack{display:flex;flex-wrap:wrap;gap:3px;flex:1;min-width:0}
.fc{font:700 12px var(--digits);background:#3d7bf0;color:#fff;border-radius:5px;padding:3px 6px;border:1px solid #f3efe4}
.fc.neg{background:var(--hazard)}
.tot{display:flex;flex-direction:column;align-items:center;font-family:var(--digits);line-height:1}
.tot b{font-size:22px;color:var(--glow)}.tot small{font-size:10px;color:var(--dim)}
.pbar{height:6px;border-radius:4px;background:#0b2219;overflow:hidden;direction:ltr}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#3d7bf0,var(--glow));transition:width .6s}
.center{display:flex;align-items:center;justify-content:center;gap:18px;padding:6px}
.deck,.disc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--dim)}
.back{width:62px;aspect-ratio:5.65/8.65;border-radius:8px;border:2px solid #f3efe4;background:repeating-linear-gradient(45deg,#7a1f2b 0 6px,#5a1620 6px 12px);box-shadow:3px 3px 0 #3a0f16,6px 6px 0 #2a0a10}
.turnmsg{font-size:15px;min-width:120px;text-align:center}.turnmsg strong{color:var(--glow)}
.handbar{position:sticky;bottom:0;z-index:3;display:flex;flex-direction:column;gap:8px;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,#0b2219 16px)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:40px}
.why{font-size:13px;color:var(--dim);padding:4px 10px;border:1px dashed var(--rim);border-radius:10px}
.hand{display:flex;gap:8px;justify-content:center;flex-wrap:nowrap}
.log{font-size:13px;color:var(--dim);max-height:120px;overflow:auto;line-height:1.7}.log div:first-child{color:var(--ink)}
.banner{text-align:center}.banner h2{font-size:34px;color:var(--glow)}
.pass{position:fixed;inset:0;background:var(--felt);display:grid;place-items:center;z-index:5}
.pass .box{text-align:center;display:flex;flex-direction:column;gap:14px}
.guide{position:fixed;inset:0;z-index:30;background:rgba(4,14,10,.9);overflow:auto;padding:16px}
.gwrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.guide section{background:var(--panel);border:1px solid var(--rim);border-radius:14px;padding:12px}
.guide h3{font-size:18px;margin-bottom:4px}.guide p,.guide li{line-height:1.6}.guide ul{margin:4px 0;padding-inline-start:18px}
@media (max-width:560px){
  .hand{gap:4px}.hand .card{width:calc((100% - 16px)/5);border-width:2px}
  .card .val{font-size:20px;bottom:16px}.card .lbl b{font-size:10px}.card .kind{font-size:8px}
  .mini-card,.mini-empty{width:36px}
  .tot b{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ctab{width:100%;border-collapse:collapse;font-size:14px}.ctab th,.ctab td{border-bottom:1px solid var(--rim);padding:5px 4px;text-align:right}.ctab th{color:var(--glow)}
.tipline{font-size:14px;background:rgba(255,207,107,.12);border:1px solid rgba(255,207,107,.45);border-radius:10px;padding:6px 10px;text-align:center}.slot.blk{outline:2px solid var(--hazard);outline-offset:3px;border-radius:10px;position:relative}
.slot.vtg{outline:2px dashed #b48cff;outline-offset:3px;border-radius:10px;position:relative}
.slot.blk::after,.slot.vtg::after{content:attr(data-blk);position:absolute;top:-11px;inset-inline-start:6px;z-index:2;color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:8px;white-space:nowrap;background:var(--hazard)}
.slot.vtg::after{background:#7a4fd0}
.slot.blk .mini-empty,.slot.blk .fc,.slot.blk .mini-card{opacity:.55}
.ceil{display:block;font-size:10px;color:var(--glow);font-weight:700}
.lanes{display:flex;flex-direction:column;gap:6px}
.lane{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid transparent}
.lane .ln{width:46px;flex:none;font-size:12px;font-weight:800;color:var(--dim)}
.lane .lhaz{margin-inline-start:auto;display:flex;gap:6px;align-items:center;padding-inline-start:8px;border-inline-start:1px dashed var(--rim)}
.lane .lhaz .mini-empty{opacity:.4;font-size:9px;border-color:var(--hazard);color:#ff9a9d}
.lane.blk{background:rgba(229,72,77,.13);border-color:var(--hazard)}
.lane.blk .slot>*{opacity:.5}
.lane.vtg{background:rgba(122,79,208,.15);border:1px dashed #b48cff}
.lane.blk .ln{color:#ff9a9d}.lane.vtg .ln{color:#cdb4ff}
.card.dim>*:not(.ctag){filter:grayscale(.85) brightness(.55)}.ctag{position:absolute;left:0;right:0;bottom:0;z-index:3;font-size:11px;line-height:1.25;font-weight:800;padding:3px 2px;text-align:center;background:rgba(0,0,0,.8)}.ctag.ok{color:#7be3a4}.ctag.no{color:#ff9a9d}
</style>

const COUNTS=[['feet',50,8],['feet',100,10],['feet',200,7],['feet',300,6],['feet',500,4],['mach',0,10],
  ['vertigo',0,6],['fuel',0,5],['ice',0,5],['horizon',0,6],['refuel',0,5],['antiice',0,5]];
const HAZ=['vertigo','fuel','ice'];

// ================= Engine: "ורטיגו הוראות חדש" (4.2016) as written =================
// Gaps the rules don't cover are marked GAP and listed in the rules panel.
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function newDeck(){let id=0,d=[];for(const[t,v,n]of COUNTS)for(let i=0;i<n;i++)d.push({id:id++,t,v});return shuffle(d)}
const alt=p=>Math.max(0,p.feet.reduce((a,f)=>a+f.eff,0));
const alive=s=>s.players.filter(p=>!p.out);
const pIdx=(s,id)=>s.players.findIndex(p=>p.id===id);
const nameOf=(s,id)=>{const p=s.players.find(p=>p.id===id);return p?p.name:'?'};
const fmt=n=>n.toLocaleString('en');
const stopped=(p,what)=>p.haz.some(h=>TYPES[h].stops===what);

function startGame(players,target){
  const s={status:'play',target,deck:newDeck(),discard:[],turn:0,winner:null,endWhy:'',log:[],seq:1,last:null,
    players:players.map(p=>({id:p.id,name:p.name,hand:[],feet:[],mach:[],machEver:false,haz:[],out:false,why:''}))};
  for(let r=0;r<5;r++)for(const p of s.players)p.hand.push(s.deck.pop());
  s.turn=rnd(s.players.length);s.log.unshift('המשחק מתחיל. '+s.players[s.turn].name+' פותח/ת.');
  beginTurn(s);return s;
}
function draw(s,p){if(!s.deck.length&&s.discard.length){s.deck=shuffle(s.discard);s.discard=[]}if(s.deck.length)p.hand.push(s.deck.pop())} // GAP: reshuffle

function cardActions(s,p,ci){
  const c=p.hand[ci],T=TYPES[c.t],out=[],opp=s.players.filter(o=>o.id!==p.id&&!o.out);
  if(c.t==='feet'){
    const tot=alt(p)+c.v;
    if(stopped(p,'feet'))out.push({no:'יש עליך קרח: אי אפשר להוסיף פיט'});
    else if(!p.mach.length)out.push({no:'קודם צריך מאך כדי להמריא'});
    else if(tot>2000&&p.mach.length<2)out.push({no:'מעל 2,000 פיט צריך שני מאך'});
    else out.push({k:'feet',label:'הנח אצלי: '+c.v+' פיט'});
    // multiplier (Avraham, 23.11.2026): mach from the hand + feet = feet x2, the mach is discarded, draw 2
    if(!stopped(p,'feet')&&!stopped(p,'mach')&&p.mach.length&&p.hand.some(x=>x.t==='mach')&&!(alt(p)+2*c.v>2000&&p.mach.length<2))
      out.push({k:'boost',label:'מכפיל: מאך מהיד + '+c.v+' = '+(2*c.v)+' פיט'});
    opp.filter(o=>o.haz.includes('vertigo')&&alt(o)>0).forEach(o=>out.push({k:'lower',to:o.id,label:'הנח על '+o.name+' (ורטיגו): −'+c.v}));
  }
  if(c.t==='mach'){
    if(p.mach.length>=2)out.push({no:'כבר יש לך 2 מאך'});
    else if(stopped(p,'mach'))out.push({no:'הדלק שלך אוזל: אי אפשר להוסיף מאך'});
    else out.push({k:'mach',label:'הנח אצלי: מאך'});
    p.hand.forEach((f,fi)=>{if(f.t==='feet'&&cardActions(s,p,fi).some(a=>a.k==='boost'))out.push({k:'boostm',feet:f.id,label:'מכפיל: '+f.v+' → '+(2*f.v)+' פיט'})});
  }
  if(HAZ.includes(c.t))opp.forEach(o=>out.push(o.haz.includes(c.t)?{no:o.name+' כבר עם '+T.name}:{k:'haz',to:o.id,label:'תן ל'+o.name}));
  if(T.solves)out.push(p.haz.includes(T.solves)?{k:'fix',label:'פתור: '+TYPES[T.solves].name}:{no:'אין עליך '+TYPES[T.solves].name});
  out.push({k:'swap',label:'החלף בקלף מהקופה',soft:1}); // any card, any time (Avraham, 23.11.2026, like Shushi's version)
  return out;
}
const anyLegal=(s,p)=>p.hand.some((c,i)=>cardActions(s,p,i).some(a=>a.k&&!a.soft));

const KAMI_MIN=0;
function act(s,pid,a){
  if(s.status!=='play')return 'המשחק נגמר';
  const p=s.players[s.turn];if(p.id!==pid)return 'לא התור שלך';
  if(a.k==='kamikaze'){ // Avraham, 23.11.2026: any time, from the start; throw the whole hand, take one card fewer. No speed or height lost
    if(p.hand.length<2)return 'צריך לפחות 2 קלפים ביד';
    const n=p.hand.length-1;s.discard.push(...p.hand);p.hand=[];
    for(let i=0;i<n;i++)draw(s,p);s.last={seq:s.seq+1,by:p.id,k:'kamikaze'};
    s.log.unshift('💥 '+p.name+' עשה/תה קמיקאזה: '+n+' קלפים חדשים (קלף אחד פחות ביד).');return endTurn(s);
  }
  if(a.k==='boostm'){const m=p.hand.find(c=>c.id===a.card);if(!m||m.t!=='mach')return 'קלף לא נמצא';a={k:'boost',card:a.feet}} // multiplier chosen from the mach card
  const ci=p.hand.findIndex(c=>c.id===a.card);if(ci<0)return 'קלף לא נמצא';
  const ok=cardActions(s,p,ci).find(x=>x.k===a.k&&(x.to||null)===(a.to||null));if(!ok)return 'מהלך לא חוקי';
  const c=p.hand.splice(ci,1)[0];const o=a.to?s.players[pIdx(s,a.to)]:null;
  s.last={seq:s.seq+1,by:p.id,k:a.k,to:a.to||null,card:{t:c.t,v:c.v}};
  if(a.k==='feet'){p.feet.push({c,eff:c.v});s.log.unshift(p.name+' הניח/ה '+c.v+' פיט. סה"כ '+fmt(alt(p))+'.');
    if(alt(p)>=s.target&&p.mach.length>=2){s.status='over';s.winner=p.id;s.endWhy=p.name+' הגיע/ה ראשון/ה ל-'+fmt(s.target)+' פיט ו-2 מאך.';s.log.unshift('🏁 '+s.endWhy);s.seq++;return null}}
  else if(a.k==='lower'){o.feet.push({c,eff:-c.v});s.log.unshift(p.name+' הניח/ה '+c.v+' פיט על '+o.name+' שבורטיגו: ירד/ה ל-'+fmt(alt(o))+'.')}
  else if(a.k==='mach'){p.mach.push(c);p.machEver=true;s.log.unshift(p.name+' הניח/ה מאך ('+p.mach.length+'/2).');
    if(alt(p)>=s.target&&p.mach.length>=2){s.status='over';s.winner=p.id;s.endWhy=p.name+' הגיע/ה ראשון/ה ל-'+fmt(s.target)+' פיט ו-2 מאך.';s.log.unshift('🏁 '+s.endWhy);s.seq++;return null}}
  else if(a.k==='haz'){o.haz.push(c.t);s.log.unshift(p.name+' נתן/ה ל'+o.name+': '+TYPES[c.t].name+'.')}
  else if(a.k==='fix'){p.haz=p.haz.filter(h=>h!==TYPES[c.t].solves);s.discard.push(c);s.log.unshift(p.name+' פתר/ה '+TYPES[TYPES[c.t].solves].name+'.')}
  else if(a.k==='boost'){const mi=p.hand.findIndex(x=>x.t==='mach');s.discard.push(p.hand.splice(mi,1)[0]);p.feet.push({c,eff:2*c.v});
    s.log.unshift('⚡ '+p.name+' הכפיל/ה: '+c.v+'×2 = '+(2*c.v)+' פיט. סה"כ '+fmt(alt(p))+'.');
    if(alt(p)>=s.target&&p.mach.length>=2){s.status='over';s.winner=p.id;s.endWhy=p.name+' הגיע/ה ראשון/ה ל-'+fmt(s.target)+' פיט ו-2 מאך.';s.log.unshift('🏁 '+s.endWhy);s.seq++;return null}
    draw(s,p);}
  else if(a.k==='swap'){s.discard.push(c);s.log.unshift(p.name+' החליף/ה קלף.')}
  if(a.k==='haz'||a.k==='lower')s.discard.push(c); // GAP: hazards and lowering cards go to the discard pile (kept as a marker on the player)
  draw(s,p);return endTurn(s);
}
function endTurn(s){const n=s.players.length;for(let i=1;i<=n;i++){const j=(s.turn+i)%n;if(!s.players[j].out){s.turn=j;break}}beginTurn(s);s.seq++;return null}
function beginTurn(s){
  for(let guard=0;guard<10&&s.status==='play';guard++){
    const live=alive(s);
    if(live.length===1){const w=live[0];s.status='over';s.winner=w.id;s.endWhy=w.name+' נשאר/ה אחרון/ה באוויר.';s.log.unshift('🏁 '+s.endWhy);return}
    if(!live.length){s.status='over';s.endWhy='כל המטוסים קורקעו.';return}
    const p=s.players[s.turn];let why='';
    const fix=p.hand.some(c=>TYPES[c.t].solves&&p.haz.includes(TYPES[c.t].solves));
    if(p.haz.length>=3&&!fix)why='קורקע/ה: שלוש תקלות בלי פתרון';
    else if(!p.hand.length)why='נגמרו הקלפים ביד';
    if(!why)return;
    p.out=true;p.why=why;s.discard.push(...p.hand);p.hand=[];s.log.unshift('✖ '+p.name+': '+why+'.');
    const n=s.players.length;for(let i=1;i<=n;i++){const j=(s.turn+i)%n;if(!s.players[j].out){s.turn=j;break}}
  }
}
function botPick(s){
  const p=s.players[s.turn],opts=[];
  p.hand.forEach((c,i)=>cardActions(s,p,i).forEach(a=>{if(a.k&&!a.soft)opts.push({k:a.k,to:a.to||null,card:c.id})}));
  const machInHand=p.hand.filter(c=>c.t==='mach').length,need=Math.max(0,2-p.mach.length);
  if(machInHand>need){const b=opts.filter(x=>x.k==='boost').sort((a,b)=>p.hand.find(c=>c.id===b.card).v-p.hand.find(c=>c.id===a.card).v);if(b.length)return b[0]}
  const order=['fix','mach','feet','lower','haz'];
  for(const k of order){const o=opts.filter(x=>x.k===k);if(o.length)return k==='feet'?o.sort((a,b)=>p.hand.find(c=>c.id===b.card).v-p.hand.find(c=>c.id===a.card).v)[0]:o[rnd(o.length)]}
  if(!p.hand.length)return null;
  if(p.hand.length>=4&&p.haz.length&&!p.hand.some(c=>TYPES[c.t].solves&&p.haz.includes(TYPES[c.t].solves)))return {k:'kamikaze'};
  const sw=p.hand.findIndex(c=>c.t!=='mach'&&!TYPES[c.t].solves);return {k:'swap',card:p.hand[sw>=0?sw:0].id};
}

// ================= Storage & identity =================
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let ME=LS.get('vtg_id');if(!ME){ME='p'+Math.random().toString(36).slice(2,10);LS.set('vtg_id',ME)}
let myName=LS.get('vtg_name')||'';
const V={screen:'home',mode:null,code:'',room:null,game:null,sel:null,kami:[],kamiOn:false,err:'',unsub:null,passTo:null,busy:false,loading:false,
  seenSeq:null,muted:LS.get('vtg_mute')==='1',wasMyTurn:false,guide:false,target:+(LS.get('vtg_target')||2000)};

// ================= Online (Claude artifact db) =================
const ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ';
const genCode=()=>Array.from({length:4},()=>ALPHA[rnd(ALPHA.length)]).join('');
const dbP=(window.claude&&claude.use)?claude.use('db').catch(()=>null):Promise.resolve(null);
dbP.then(d=>{V.noDb=!d;if(V.screen==='home')render()});
const docRef=async code=>{const db=await dbP;if(!db)throw new Error('אין חיבור');return db.collection('games').doc(code)};
async function apiGet(code){const r=await docRef(code);const s=await r.get();return s.exists?s.data():null}
async function apiPut(code,room,expect){
  const r=await docRef(code);const l=await r.acquire({holder:ME,ttlMs:3000});
  if(!l.acquired){const e=new Error('conflict');e.code='conflict';throw e}
  const s=await r.get();const cur=s.exists?s.data().seq:null;
  if((expect??null)!==(cur??null)){const e=new Error('conflict');e.code='conflict';throw e}
  const next={...room,seq:(cur||0)+1,at:Date.now()};await r.set(next);return next;
}
let lastSeq=-1;
function applyRoom(d){if(!d){V.room=null;render();return}if(d.seq===lastSeq)return;lastSeq=d.seq;V.room=d;try{V.game=d.s?JSON.parse(d.s):null}catch(e){V.game=null}V.err='';render()}
function subscribe(code){
  if(V.unsub)V.unsub();lastSeq=-1;V.loading=true;let un=null,dead=false;
  const t=setTimeout(()=>{if(V.loading){V.err='אין עדיין חיבור לשרת. בדקו את האינטרנט.';render()}},10000);
  docRef(code).then(r=>{if(dead)return;un=r.onSnapshot(s=>{if(!s.metadata||!s.metadata.fromCache){V.loading=false;clearTimeout(t)}if(!V.busy)applyRoom(s.exists?s.data():null)},
    e=>{V.loading=false;clearTimeout(t);V.err='החיבור נפל ('+(e&&e.code||'שגיאה')+'). רעננו את הדף.';render()})});
  V.unsub=()=>{dead=true;clearTimeout(t);if(un)un()};
}
async function save(room){const out=await apiPut(V.code,room,V.room?V.room.seq:null);lastSeq=-1;applyRoom(out)}
async function createRoom(){
  if(!myName.trim()){V.err='כתבו שם קודם';return render()}
  const code=genCode();V.busy=true;render();
  try{const out=await apiPut(code,{status:'lobby',host:ME,players:[{id:ME,name:myName.trim()}],target:V.target,s:''},null);
    V.code=code;V.mode='online';V.screen='room';V.busy=false;applyRoom(out);subscribe(code)}catch(e){V.err=e.code==='conflict'?'נסו שוב':'לא הצלחתי לפתוח משחק ('+e.message+')'}
  V.busy=false;render();
}
async function joinRoom(code){
  code=code.trim().toUpperCase();
  if(!myName.trim()){V.err='כתבו שם קודם';return render()}
  if(code.length!==4){V.err='קוד המשחק הוא 4 אותיות';return render()}
  V.busy=true;render();
  try{for(let k=0;k<3;k++){const d=await apiGet(code);
      if(!d){V.err='אין משחק עם הקוד '+code;V.busy=false;return render()}
      if(!d.players.some(p=>p.id===ME)){
        if(d.status!=='lobby'){V.err='המשחק כבר התחיל';V.busy=false;return render()}
        if(d.players.length>=5){V.err='המשחק מלא (5)';V.busy=false;return render()}
        try{await apiPut(code,{...d,players:[...d.players,{id:ME,name:myName.trim()}]},d.seq)}catch(e){if(e.code==='conflict')continue;throw e}}
      V.code=code;V.mode='online';V.screen='room';subscribe(code);break}
  }catch(e){V.err='ההצטרפות נכשלה ('+e.message+')'}
  V.busy=false;render();
}
async function writeGame(g){V.busy=true;try{await save({...V.room,status:g.status,s:JSON.stringify(g)})}catch(e){V.err=e.code==='conflict'?'מישהו שיחק במקביל. המצב עודכן.':'המהלך לא נשמר ('+e.message+')';lastSeq=-1}V.busy=false;render()}

function resetView(){V.seenSeq=null;V.sel=null;V.sel2=null;V.kami=[];V.kamiOn=false;V.err=''}
function startLocal(names){resetView();V.mode='local';V.game=startGame(names.map((n,i)=>({id:'L'+i,name:n})),V.target);V.screen='game';V.passTo=V.game.players[V.game.turn].id;render()}
function startBot(){resetView();V.mode='bot';V.game=startGame([{id:'H0',name:(myName.trim()||'את/ה')},{id:'B1',name:'המחשב'}],V.target);V.screen='game';render();botTurn()}
function botTurn(){clearTimeout(V.botT);const g=V.game;if(V.mode!=='bot'||!g||g.status!=='play'||g.players[g.turn].id!=='B1')return;
  V.botT=setTimeout(()=>{if(V.mode!=='bot')return;const s=JSON.parse(JSON.stringify(V.game));if(s.players[s.turn].id!=='B1')return;const a=botPick(s);if(a)act(s,'B1',a);V.game=s;render();botTurn()},1800)}
function myId(){if(V.mode==='bot')return 'H0';return V.mode==='local'?(V.game&&V.game.players[V.game.turn].id):ME}
function doAction(a){
  const g=JSON.parse(JSON.stringify(V.game));const who=myId();const err=act(g,who,a);if(err){V.err=err;return render()}
  V.sel=null;V.sel2=null;V.kami=[];V.kamiOn=false;V.err='';
  if(V.mode==='bot'){V.game=g;render();botTurn()}
  else if(V.mode==='local'){V.game=g;if(g.status==='play'&&g.players[g.turn].id!==who)V.passTo=g.players[g.turn].id;render()}
  else{V.game=g;render();writeGame(g)}
}

      <tr><td>קרח על הכנפיים</td><td>5</td><td>ליריב: לא יכול להניח פיט</td></tr>
      <tr><td>ורטיגו</td><td>6</td><td>ליריב: כולם יכולים להוריד לו פיט</td></tr>
      <tr><td>מטוס תדלוק</td><td>5</td><td>פותר הדלק אוזל</td></tr>
      <tr><td>אנטי-אייס</td><td>5</td><td>פותר קרח</td></tr>
      <tr><td>מד אופק</td><td>6</td><td>פותר ורטיגו</td></tr></table>
      <p class="muted">אין קלף טוב? כל קלף אפשר להחליף בקלף מהקופה.</p></div></section>
    <section><div><h3>בכל תור, אחד מאלה</h3><ul>
      <li>להניח אצלך קלף <b>מאך</b> או <b>פיט</b>. בלי מאך אין המראה. מעל 2,000 פיט צריך שני מאך.</li>
      <li>לתת ליריב <b>תקלה</b>: הדלק אוזל (לא יכול להניח מאך), קרח על הכנפיים (לא יכול להניח פיט), ורטיגו.</li>
      <li>לפתור תקלה שיש עליך: מטוס תדלוק, אנטי-אייס, מד אופק.</li></ul><p class="muted">אחרי כל מהלך לוקחים קלף מהקופה.</p></div></section>
    <section><div><h3>ורטיגו</h3><p>כל עוד יריב בורטיגו, שאר השחקנים בתורם יכולים להניח קלפי פיט <b>על הערימה שלו</b>, וכל קלף כזה מוריד לו פיט. יוצאים עם מד אופק.</p></div></section>
    <section><div><h3>החלפת קלפים (שונה 23.11)</h3><p>אין קלף טוב? בכל שלב אפשר להחליף <b>כל קלף</b> בקלף מהקופה. זה התור שלך. (במקום החלפת פיט וקמיקאזה, כמו בגרסה של שושי.)</p></div></section>
    <section><div><h3>מכפיל (חדש 23.11)</h3><p>כבר באוויר (מאך אחד לפחות על השולחן)? מניחים <b>מאך מהיד יחד עם קלף פיט</b>, והפיט שווה <b>פי 2</b>. המאך נזרק, ולוקחים 2 קלפים.</p></div></section>
    <section><div><h3>קמיקאזה (חדש 23.11)</h3><p>בכל תור, גם בהתחלה: זורקים את <b>כל היד</b> ולוקחים קלפים חדשים. המחיר: <b>קלף אחד פחות ביד</b> (5 → 4). לא מאבדים מהירות ולא גובה.</p></div></section>
    <section><div><h3>מפסידים</h3><p>מי שקורקע בשלוש תקלות בלי פתרון. מי שנשאר אחרון באוויר מנצח.</p></div></section>
    <section><div><h3>מה השלמתי (לא כתוב בחוקים)</h3><ul class="muted"><li>קרח ואנטי-אייס במקום "מנוע בוער" ו"מטוס ממריא", כמו בסט שהודפס.</li><li>יעד לבחירה. 4,000 כתוב בחוקים, אבל בכל החבילה יש 6,600 פיט.</li><li>כשהקופה נגמרת, מערבבים את הזרוקים.</li><li>אפשר לשחק גם בשניים.</li></ul></div></section>
    <button class="go" id="gclose2" style="width:100%">סגור</button></div></div>`;
}

// ================= "הערה לתיקון": a note for Avraham on WhatsApp, with the game state attached =================
function gameSnapshot(){
  const g=V.game;if(!g)return 'מסך: '+V.screen;
  const P=g.players.map(p=>p.name+': גובה '+alt(p)+', מאך '+p.mach.length+(p.haz.length?', תקלות '+p.haz.map(h=>TYPES[h].name).join('+'):'')+(p.out?' (בחוץ)':'')).join(' | ');
  const me=g.players.find(p=>p.id===myId());
  const hand=me?me.hand.map(c=>TYPES[c.t].name+(c.v?' '+c.v:'')).join(', '):'';
  return 'מצב: '+(V.mode||'')+' · יעד '+g.target+' · תור של '+g.players[g.turn].name+'\n'+P+(hand?'\nביד: '+hand:'')+'\nאחרונים: '+g.log.slice(0,4).join(' / ');
}
function feedbackHTML(){
  return `<div class="guide" role="dialog" aria-label="הערה לתיקון"><div class="gwrap">
    <div class="row" style="justify-content:space-between"><h2>הערה לתיקון</h2><button class="icon-btn" id="fbclose">✕</button></div>
    <section><p>מה לא עבד, או מה כדאי לשנות? כתבו במילים שלכם. מצב המשחק ברגע הזה מצורף אוטומטית.</p>
      <textarea id="fbtext" rows="5" style="width:100%;font:inherit;background:#0c241b;color:var(--ink);border:1px solid var(--rim);border-radius:10px;padding:10px" placeholder="למשל: הנחתי מאך שני ולא קרה כלום">${esc(V.fbText||'')}</textarea>
      <details style="margin-top:8px"><summary class="muted">מה מצורף</summary><pre style="white-space:pre-wrap;font-size:12px;color:var(--dim)">${esc(gameSnapshot())}</pre></details></section>
    <a class="btn go" id="fbsend" href="#" target="_blank" rel="noopener" style="text-align:center;text-decoration:none;padding:12px;border-radius:10px;display:block">שלח בוואטסאפ</a>
    <p class="muted note" style="text-align:center;margin:0">ייפתח וואטסאפ עם ההודעה מוכנה. בוחרים את אברהם ושולחים.</p></div></div>`;
}
function fbLink(){return 'https://wa.me/?text='+encodeURIComponent('ורטיגו · הערה לתיקון:\n'+(V.fbText||'')+'\n\n---\n'+gameSnapshot())}

function render(){
  const app=$('#app');let h='';
  if(V.screen==='home')h=renderHome();else if(V.screen==='room')h=renderRoom();else h=renderGame();
  app.innerHTML=h+(V.guide?rulesHTML():'')+(V.fb?feedbackHTML():'');bind();afterRender();
}
function targetSel(id){return `<select id="${id}" aria-label="יעד">${[2000,3000,4000].map(t=>`<option value="${t}" ${t===V.target?'selected':''}>יעד ${fmt(t)}${t===4000?' (כמו בחוקים)':''}</option>`).join('')}</select>`}
function renderHome(){
  const fan=[{t:'feet',v:500},{t:'mach'},{t:'vertigo'},{t:'horizon'},{t:'ice'}];
  return `<div class="hero"><div class="tag">Swing · 2016</div><h1>ורטיגו</h1><p>משחק קלפים: להגיע ראשון לגובה ול-2 מאך.</p>
    <div class="fan">${fan.map((c,i)=>cardHTML({...c,id:-1},'','animation-delay:'+(i*.08)+'s;transform:rotate('+((i-2)*9)+'deg) translateY('+(Math.abs(i-2)*8)+'px)')).join('')}</div>
    <div class="row" style="justify-content:center;margin-top:8px"><button class="go" id="bot">שחק נגד המחשב</button><button id="rules">החוקים</button><button id="fb">💬 הערה לתיקון</button></div></div>
  <div class="box row"><label for="nm">השם שלך</label><input id="nm" value="${esc(myName)}" maxlength="14" placeholder="למשל: אריה" style="flex:1">${targetSel('tsel')}</div>
  <div class="home-grid">
${V.noDb?'':`    <div class="box"><h3>משחק ברשת</h3><button class="go" id="create" ${V.busy?'disabled':''}>פתח משחק</button></div>
    <div class="box"><h3>הצטרפות עם קוד</h3><input id="jcode" maxlength="4" placeholder="ABCD" autocomplete="off" style="font-family:var(--digits);letter-spacing:.3em;text-transform:uppercase;text-align:center"><button id="join" ${V.busy?'disabled':''}>הצטרף</button></div>
`}    <div class="box"><h3>על טלפון אחד</h3><input id="lnames" placeholder="אברהם, אריה" value="${esc(LS.get('vtg_local')||'')}"><button id="local">התחל</button></div>
  </div>
  ${V.noDb?'<p class="note muted" style="text-align:center">בכתובת הזו אפשר לשחק נגד המחשב או על טלפון אחד.</p>':''}
  ${V.err?`<p style="color:var(--hazard);text-align:center">${esc(V.err)}</p>`:''}`;
}
function renderRoom(){
  const r=V.room;if(V.game&&r&&r.status!=='lobby'){V.screen='game';return renderGame()}
  if(!r)return `<div class="box">${V.loading?'מתחבר…':'המשחק לא נמצא.'}</div><button id="home">חזרה</button>`;
  const host=r.host===ME;
  return `<h2>חדר המתנה</h2><div class="box row" style="justify-content:space-between"><div><div class="muted">קוד</div><div class="code">${esc(V.code)}</div></div><button id="copy">העתק</button></div>
  <div class="box">${r.players.map(p=>`<span class="chip ok">${esc(p.name)}</span>`).join(' ')}</div>
  ${host?`<button class="go" id="start" ${r.players.length>=2?'':'disabled'}>${r.players.length>=2?'התחל':'מחכים לעוד שחקן'}</button>`:'<p class="muted">מחכים למארח.</p>'}
  <button id="home">יציאה</button>`;
}
function board(g,p,mine,i){
  const cur=g.players[g.turn],tot=alt(p);
  const fuel=p.haz.includes('fuel'),ice=p.haz.includes('ice'),vtg=p.haz.includes('vertigo');
  const ceil=!p.mach.length?'על הקרקע':p.mach.length===1?'תקרה 2,000':'בלי תקרה';
  const hz=t=>p.haz.includes(t)?`<div class="mini-card hz" style="--c:#e5484d"><img src="${IMG[TYPES[t].img]}" alt=""><span>${TYPES[t].name}</span></div>`:`<div class="mini-empty">${{fuel:'דלק',ice:'קרח',vertigo:'ורטיגו'}[t]}</div>`;
  const fTag=[ice?'❄ קרח: אין פיט':'',vtg?'⬇ ורטיגו':''].filter(Boolean).join(' · ');
  const feet=p.feet.map(f=>`<div class="fc ${f.eff<0?'neg':''}">${f.eff<0?'−':''}${Math.abs(f.eff)}</div>`).join('');
  return `<div class="board ${mine?'mine':''} ${p.id===cur.id&&g.status==='play'?'turn':''} ${p.out?'out':''}" data-pid="${esc(p.id)}">
    <div class="bh"><b>${esc(p.name)}</b><span class="muted">${p.out?esc(p.why):p.hand.length+' קלפים ביד'}</span></div>
    <div class="lanes">
      <div class="lane ${fuel?'blk':''}"><span class="ln">מהירות</span><div class="slot mach">${[0,1].map(k=>p.mach[k]?`<div class="mini-card" style="--c:#9b5cf0"><img src="${IMG.mach}" alt=""><span>מאך</span></div>`:`<div class="mini-empty">${k?'מאך 2<br>מעל 2,000':'מאך 1<br>המראה'}</div>`).join('')}</div>
        <div class="lhaz">${hz('fuel')}</div></div>
      <div class="lane ${ice?'blk':vtg?'vtg':''}"><span class="ln">גובה</span><div class="slot feet"><div class="fstack">${feet||`<div class="mini-empty wide">${p.mach.length?'פיט':'פיט אחרי המראה'}</div>`}</div><div class="tot"><b>${fmt(tot)}</b><small>/ ${fmt(g.target)}</small><span class="ceil">${ceil}</span></div></div>
        <div class="lhaz">${hz('ice')}${hz('vertigo')}</div></div>
    </div>
    <div class="pbar"><i style="width:${Math.min(100,tot/g.target*100)}%"></i></div>
  </div>`;
}
function renderGame(){
  const g=V.game;if(!g)return '<div class="box">טוען…</div>';
  if(V.mode==='local'&&V.passTo&&g.status==='play')return `<div class="pass"><div class="box"><h2>התור של ${esc(nameOf(g,V.passTo))}</h2><button class="go" id="ready">אני מוכן/ה</button></div></div>`;
  const cur=g.players[g.turn],me=g.players.find(p=>p.id===myId());
  const myTurn=g.status==='play'&&cur.id===myId()&&!V.busy;
  let actions='';
  if(myTurn&&me){
    if(V.kamiOn)actions=`<span class="note">קמיקאזה: בחרו 2 קלפים (${V.kami.length}/2)</span><button class="go" id="kgo" ${V.kami.length===2?'':'disabled'}>זרוק שניים, קח אחד</button><button id="kcancel">ביטול</button>`;
    else if(V.sel!=null&&V.sel2!=null){const f=boostPair(me);actions=f?`<button class="go" id="boostgo">⚡ ${f.v} × 2 = ${2*f.v} פיט</button><button id="boostno">ביטול</button>`:''}
    else if(V.sel!=null){const ci=me.hand.findIndex(c=>c.id===V.sel);if(ci>=0){const al=cardActions(g,me,ci),real=al.some(a=>a.k&&!a.soft),hasB=al.some(a=>a.k==='boost'||a.k==='boostm');
      actions=al.map((a,i)=>a.k==='boost'||a.k==='boostm'?'':a.k?`<button class="${a.soft?'':'go'}" data-act="${i}">${esc(a.label)}</button>`:real?'':`<span class="why">${esc(a.no)}</span>`).join('')+(hasB?`<span class="note">⚡ סמן גם ${me.hand[ci].t==='mach'?'פיט':'מאך'} להכפלה</span>`:'')}}
    else{const canPlay=anyLegal(g,me),canSwap=true;
      let tip;
      const HT={fuel:me.mach.length?'הדלק אוזל: אין מאך חדש עד מטוס תדלוק. פיט אפשר.':'הדלק אוזל ואין מאך: אי אפשר להמריא עד מטוס תדלוק.',ice:'קרח: צריך אנטי-אייס.',vertigo:'ורטיגו: צריך מד אופק.'};
      const hz=me.haz.map(x=>HT[x]).filter(Boolean),hasFix=me.hand.some(c=>TYPES[c.t].solves&&me.haz.includes(TYPES[c.t].solves));
      if(hz.length)tip=hz.join(' ')+(hasFix?'':' אין? החלף קלף או קמיקאזה.');
      else if(!canPlay)tip='אין מהלך: החלף קלף או קמיקאזה.';
      else if(!me.mach.length)tip='קודם מאך כדי להמריא.';
      else tip='בחר קלף.';
      actions=`<span class="tipline">${esc(tip)}</span>${me.hand.length>=2?'<button id="kami">💥 קמיקאזה: יד חדשה, קלף אחד פחות</button>':''}`;}
  }
  const others=g.players.filter(p=>p.id!==myId()).map((p,i)=>board(g,p,false,i)).join('');
  const over=g.status==='over'?`<div class="box banner"><h2>${g.winner?esc(nameOf(g,g.winner))+' ניצח/ה':'אין מנצח'}</h2><p>${esc(g.endWhy)}</p><div class="row" style="justify-content:center">${V.mode!=='online'||(V.room&&V.room.host===ME)?'<button class="go" id="again">עוד משחק</button>':''}<button id="home">לתפריט</button></div></div>`:'';
  const top=g.discard[g.discard.length-1];
  return `<div class="top"><h2>ורטיגו</h2><div class="row" style="gap:6px">${V.mode==='online'?'<b style="font-family:var(--digits);color:var(--glow)">'+esc(V.code)+'</b>':''}<button class="icon-btn" id="fb">💬 הערה לתיקון</button><button class="icon-btn" id="rules">החוקים</button><button class="icon-btn" id="mute">${V.muted?'🔇':'🔊'}</button>${V.mode!=='online'?'<button class="icon-btn" id="home">✕</button>':''}</div></div>
   ${over}
   <div class="table">
     ${others}
     <div class="center"><div class="deck"><div class="back"></div><span>קופה ${g.deck.length}</span></div>
       <div class="disc">${top?cardHTML({...top,id:-2},'pile'):'<div class="mini-empty">זרוקים</div>'}<span>זרוקים</span></div>
       <div class="turnmsg">${g.status==='over'?'':myTurn?'<strong>התור שלך</strong>':'התור של <strong>'+esc(cur.name)+'</strong>'}</div></div>
     ${me?board(g,me,true):''}
   </div>
   ${me&&!me.out?`<div class="handbar"><div class="actions">${actions}</div><div class="hand">${me.hand.map((c,ci)=>withTag(cardHTML(c,((V.sel===c.id||V.sel2===c.id||V.kami.includes(c.id))?'sel ':'')+(myTurn&&!V.kamiOn&&!cardActions(g,me,ci).some(a=>a.k&&!a.soft)?'dim':'')),myTurn?cardTag(g,me,ci):'')).join('')}</div></div>`:''}
   ${V.err?`<p style="color:var(--hazard);text-align:center">${esc(V.err)}</p>`:''}
   <div class="box log">${g.log.slice(0,15).map(l=>`<div>${esc(l)}</div>`).join('')}</div>`;
}
function afterRender(){
  const g=V.game;if(V.screen!=='game'||!g)return;
  if(V.seenSeq===null){V.seenSeq=g.seq;return}
  if(g.seq!==V.seenSeq){V.seenSeq=g.seq;snap();if(g.last){const el=document.querySelector(`.board[data-pid="${CSS.escape(g.last.to||g.last.by)}"]`);if(el){el.classList.add('pulse');setTimeout(()=>el.classList.remove('pulse'),900)}}}
  const myTurn=g.status==='play'&&g.players[g.turn].id===myId()&&(V.mode==='online'||V.mode==='bot');
  if(myTurn&&!V.wasMyTurn)tone(740,.12);V.wasMyTurn=myTurn;
}
function bind(){
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f};
  const nm=$('#nm');if(nm)nm.oninput=()=>{myName=nm.value;LS.set('vtg_name',myName)};
  const ts=$('#tsel');if(ts)ts.onchange=()=>{V.target=+ts.value;LS.set('vtg_target',ts.value)};
  on('create',createRoom);on('join',()=>joinRoom($('#jcode').value));on('bot',startBot);
  on('local',()=>{const raw=$('#lnames').value;LS.set('vtg_local',raw);const names=raw.split(/[,،]/).map(s=>s.trim()).filter(Boolean);if(names.length<2||names.length>5){V.err='צריך 2 עד 5 שמות, עם פסיק';return render()}startLocal(names)});
  on('rules',()=>{V.guide=true;render()});
  on('fb',()=>{V.fb=true;render()});on('fbclose',()=>{V.fb=false;render()});
  const fbt=$('#fbtext'),fbs=$('#fbsend');if(fbt&&fbs){const upd=()=>{V.fbText=fbt.value;fbs.href=fbLink()};fbt.oninput=upd;upd();fbs.onclick=()=>{setTimeout(()=>{V.fb=false;V.fbText='';render()},400)}}on('gclose',()=>{V.guide=false;render()});on('gclose2',()=>{V.guide=false;render()});
  on('home',()=>{clearTimeout(V.botT);if(V.unsub)V.unsub();V.unsub=null;Object.assign(V,{screen:'home',mode:null,code:'',room:null,game:null});resetView();render()});
  on('copy',()=>{try{navigator.clipboard.writeText(V.code)}catch(e){}});
  on('start',()=>{resetView();const g=startGame(V.room.players,V.room.target||V.target);V.game=g;writeGame(g)});
  on('ready',()=>{V.passTo=null;render()});
  on('again',()=>{resetView();if(V.mode==='bot')startBot();else if(V.mode==='local')startLocal(V.game.players.map(p=>p.name));else{const g=startGame(V.room.players,V.room.target||V.target);V.game=g;writeGame(g)}});
  on('mute',()=>{V.muted=!V.muted;LS.set('vtg_mute',V.muted?'1':'0');render()});
  on('kami',()=>doAction({k:'kamikaze'}));on('kcancel',()=>{V.kamiOn=false;V.kami=[];render()});on('kgo',()=>doAction({k:'kamikaze',cards:V.kami.slice()}));
  document.querySelectorAll('.hand [data-card]').forEach(el=>el.onclick=()=>{const id=+el.dataset.card;V.err='';
    if(V.kamiOn){V.kami=V.kami.includes(id)?V.kami.filter(x=>x!==id):V.kami.length<2?[...V.kami,id]:V.kami;return render()}
    if(V.sel2!=null){if(id===V.sel||id===V.sel2){V.sel=id===V.sel?V.sel2:V.sel;V.sel2=null}else{V.sel=id;V.sel2=null}return render()}
    if(V.sel!=null&&V.sel!==id&&boostPair(V.game.players.find(p=>p.id===myId()),id)){V.sel2=id;return render()}
    V.sel=V.sel===id?null:id;render()});
  on('boostgo',()=>{const f=boostPair(V.game.players.find(p=>p.id===myId()));if(f)doAction({k:'boost',card:f.id})});on('boostno',()=>{V.sel2=null;render()});
  document.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>{const g=V.game,me=g.players.find(p=>p.id===myId()),ci=me.hand.findIndex(c=>c.id===V.sel);const a=cardActions(g,me,ci)[+el.dataset.act];doAction({k:a.k,card:V.sel,to:a.to||null,feet:a.feet})});
}
render();

</script>
